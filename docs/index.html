<!DOCTYPE html>
<!--
  魔導研究記《まどけん》 ― 入口(待機ページ)

  ★ このページは GitHub Pages が出す。ゲーム本体(Render)とは別の場所にある。

  なぜ分けてあるか:
    ゲーム本体は無料プランで動かしていて、15分ほど誰も遊ばないと眠る。
    起こすのに30〜60秒かかり、その間 Render の起動画面が出る。
    初めて来た人はそれを見て「壊れている」と思ってしまう。

    眠っている間、こちらのサーバーは何も動いていない ― 本体の中に
    どんな案内を書いても、そもそも配れない。だから常に起きている場所に
    この1枚だけを置き、ここでお待たせしてから本体へ送る。

  ★ ここは絶対にサーバーへ依存させないこと。
    外部の CSS・フォント・スクリプトも読まない(読みに行った先が遅いと、
    肝心の「すぐ出る」が崩れる)。絵は同じ場所に置いた2枚だけ。
    文字は絵が届く前に読めるようにしてある。
-->
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>魔導研究記《まどけん》</title>
<meta name="description" content="調合で魔法を作る、ブラウザで遊べる多人数の魔法研究ゲーム。">
<meta property="og:type" content="website">
<meta property="og:title" content="魔導研究記《まどけん》">
<meta property="og:description" content="調合で魔法を作る、ブラウザで遊べる多人数の魔法研究ゲーム。">
<meta property="og:url" content="https://towa219.github.io/madoken/">
<!-- OGPの絵もこちら側に置く。本体側を指すと、眠っている時に
     取りに来た相手(SNSの下読み)が絵を拾えず、カードが崩れる。 -->
<meta property="og:image" content="https://towa219.github.io/madoken/ogp.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://towa219.github.io/madoken/ogp.png">
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: #0d0d1a; color: #ddddee;
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", sans-serif;
    display: flex; align-items: center; justify-content: center;
    padding: 20px; text-align: center;
  }
  /* サムネイルを載せるので少し広げてある(以前は460px) */
  #box { max-width: 560px; width: 100%; }

  /* 題字は本体と同じ絵(title.svg)。ここは待機ページなので、
     サーバーが眠っていても開けるよう、絵も docs/ に置いてある。
     作り直しは tools/title/build_title.py(2か所へ同時に書き出す)。 */
  h1 { margin: 0 0 6px; line-height: 0; }
  h1 img {
    width: 100%; max-width: 440px; height: auto; display: block; margin: 0 auto;
  }
  .sub { font-size: 12px; color: #777799; margin: 0 0 22px; }

  /* 魔法陣。絵が届く前でも高さを取っておく(文字が飛び跳ねない) */
  #circles {
    position: relative; width: 180px; height: 180px; margin: 0 auto 20px;
  }
  #circles i {
    position: absolute; inset: 0; display: block;
    background-repeat: no-repeat; background-position: center;
    background-size: contain; opacity: 0.85;
  }
  /* 外と内を逆に回す。同じ向きだと1枚の絵に見えて動きが出ない */
  #outer { background-image: url('circle.png'); animation: spin 14s linear infinite; }
  #inner {
    background-image: url('circle_inner.png'); transform: scale(0.62);
    animation: spin-back 9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes spin-back { to { transform: scale(0.62) rotate(-360deg); } }

  #lead { font-size: 17px; color: #ccbbee; margin: 0 0 14px; font-weight: bold; }
  #why {
    font-size: 13px; line-height: 1.8; color: #aaaacc; margin: 0 0 18px;
    text-align: left; background: #16162a; border: 1px solid #2a2a45;
    border-radius: 8px; padding: 12px 14px;
  }
  #why b { color: #ddddee; }

  #dots { display: flex; gap: 7px; justify-content: center; margin-bottom: 8px; }
  #dots.hidden { display: none; }
  #dots span {
    width: 9px; height: 9px; border-radius: 50%;
    background: #2a2a4a; border: 1px solid #44446a;
  }
  #dots span.on { background: #8866ee; border-color: #aa88ff; }
  #elapsed { font-size: 12px; color: #8888aa; min-height: 18px; margin-bottom: 16px; }

  a.go, button.go {
    display: inline-block; background: #2a2a4a; color: #ddddee;
    border: 1px solid #44446a; border-radius: 6px; padding: 8px 18px;
    font-size: 13px; font-family: inherit; text-decoration: none; cursor: pointer;
  }
  a.go:hover, button.go:hover { background: #3a3a5f; }
  .hidden { display: none; }
  #slow { font-size: 12px; color: #8888aa; margin-top: 14px; line-height: 1.7; }
  #foot { font-size: 11px; color: #55556e; margin-top: 24px; }

  /* サーバーが既に起きていた時の案内 */
  #ready.hidden { display: none; }
  #ready { margin-bottom: 16px; }
  a.go.enter, button.go.enter {
    background: #4a2f8f; border-color: #7755cc; color: #eee6ff;
    font-size: 15px; padding: 11px 30px;
  }
  a.go.enter:hover, button.go.enter:hover { background: #5c3cb0; }
  #ready-count { font-size: 12px; color: #8888aa; margin: 10px 0 0; }

  /* 予告編 */
  #pv-box { margin-bottom: 16px; }

  /* サムネイル。動画と同じ縦横比で、押すとそのまま再生に入る。 */
  #pv-thumb {
    display: block; width: 100%; padding: 0; margin: 0 0 10px;
    position: relative; overflow: hidden; cursor: pointer;
    background: #0a0a14; border: 1px solid #3a3a5c; border-radius: 10px;
    /* 絵が届く前から場所を取っておく。後から入ると下の文字が飛び跳ねる。 */
    aspect-ratio: 1280 / 704;
  }
  #pv-thumb img {
    display: block; width: 100%; height: 100%; object-fit: cover;
    transition: transform 0.25s ease, filter 0.25s ease;
  }
  #pv-thumb:hover { border-color: #7755cc; }
  #pv-thumb:hover img { transform: scale(1.03); filter: brightness(1.08); }

  /* 再生の印。丸の中に三角を描く(画像を増やさない) */
  .pv-play {
    position: absolute; left: 50%; top: 50%; width: 62px; height: 62px;
    margin: -31px 0 0 -31px; border-radius: 50%;
    background: #0d0d1acc; border: 2px solid #ccbbee;
    box-shadow: 0 0 18px #00000088;
    transition: background 0.25s ease, transform 0.25s ease;
  }
  .pv-play::after {
    content: ''; position: absolute; left: 24px; top: 18px;
    border-style: solid; border-width: 12px 0 12px 19px;
    border-color: transparent transparent transparent #eee6ff;
  }
  #pv-thumb:hover .pv-play { background: #4a2f8fdd; transform: scale(1.08); }

  .pv-time {
    position: absolute; right: 8px; bottom: 8px;
    background: #05050cd9; color: #ddddee; border-radius: 4px;
    padding: 2px 7px; font-size: 12px; letter-spacing: 0.5px;
  }

  #btn-pv { font-size: 13px; padding: 9px 20px; border-color: #5533aa; color: #ccbbee; }
  #btn-pv:hover { background: #3a2a5f; }

  #pv-modal {
    position: fixed; inset: 0; z-index: 20; background: #05050cf2;
    display: flex; align-items: center; justify-content: center; padding: 16px;
  }
  #pv-modal.hidden { display: none; }
  #pv-inner { width: 100%; max-width: 900px; text-align: center; }
  #pv-video {
    width: 100%; height: auto; border-radius: 8px; border: 1px solid #33335a;
    background: #000;
  }
  #pv-actions { display: flex; gap: 8px; justify-content: center; margin-top: 12px; }
  #pv-note { font-size: 12px; color: #88bbaa; margin: 10px 0 0; min-height: 18px; }

  /* 動きを減らす設定の端末では回さない */
  @media (prefers-reduced-motion: reduce) {
    #outer, #inner { animation: none; }
  }
</style>
</head>
<body>
<div id="box">
  <h1><img src="title.svg" alt="魔導研究記《まどけん》" width="829" height="132"></h1>
  <p class="sub">調合で魔法を作る、多人数の魔法研究ゲーム</p>

  <div id="circles" aria-hidden="true"><i id="outer"></i><i id="inner"></i></div>

  <p id="lead">✧ 魔導炉に火を入れています ✧</p>

  <div id="why">
    誰も遊んでいない間、この世界は<b>眠っています</b>。
    いま起こしているところです ―
    <b>故障ではありません</b>ので、そのままお待ちください。<br>
    初回は<b>30〜60秒</b>ほどかかります。準備ができ次第、<b>自動で始まります</b>。
  </div>

  <div id="dots" aria-hidden="true"></div>
  <div id="elapsed"></div>

  <div id="pv-box">
    <!-- 押すと動画が始まる。絵は動画の1コマ(pv_poster.jpg)をそのまま使う。
         枠は縦横比だけ先に決めてあるので、絵が届く前でも下の文字が飛ばない。 -->
    <button id="pv-thumb" aria-label="予告編を再生する（45秒）">
      <img src="pv_poster.jpg" alt="" width="1280" height="704">
      <span class="pv-play" aria-hidden="true"></span>
      <span class="pv-time" aria-hidden="true">0:45</span>
    </button>
    <button class="go" id="btn-pv">▶ 予告編を見る（45秒）</button>
  </div>

  <!-- サーバーが既に起きていた時。すぐ飛ばさず、数秒だけ選ばせる -->
  <div id="ready" class="hidden">
    <button class="go enter" id="btn-enter">ゲームを始める</button>
    <p id="ready-count"></p>
  </div>

  <div id="slow" class="hidden">
    まだ目を覚ましません。もう少しかかるようです。<br>
    <a class="go" id="direct" href="https://madoken.onrender.com/">待たずに開く</a>
  </div>

  <div id="failed" class="hidden">
    <p id="failmsg">うまく起こせませんでした。時間をおいてもう一度お試しください。</p>
    <button class="go" id="retry">もう一度ためす</button>
    <a class="go" href="https://madoken.onrender.com/">そのまま開く</a>
  </div>

  <p id="foot">© 2026 YuriPapa</p>
</div>

<!-- 予告編。押されるまで読み込まない(preload="none")。
     待機ページの取り柄は「すぐ出る」ことなので、21MBの動画を
     最初から読みに行かせてはいけない。 -->
<div id="pv-modal" class="hidden">
  <div id="pv-inner">
    <video id="pv-video" controls playsinline preload="none"
           poster="pv_poster.jpg" width="1280" height="704">
      <source src="pv.mp4" type="video/mp4">
    </video>
    <div id="pv-actions">
      <button class="go" id="btn-pv-close">閉じる</button>
      <a class="go" id="btn-pv-play" href="https://madoken.onrender.com/">今すぐ遊ぶ</a>
    </div>
    <p id="pv-note"></p>
  </div>
</div>

<script>
(function () {
  'use strict';

  var GAME  = 'https://madoken.onrender.com/';
  var PROBE = 'https://madoken.onrender.com/api/status';

  var DOTS      = 8;
  var FULL_SEC  = 60;    // 印が全部灯るまでの秒数(目安の表示にだけ使う)
  var SLOW_SEC  = 25;    // これを過ぎたら「待たずに開く」も出す
  var GIVEUP_SEC = 180;  // ここまでで諦めて、選んでもらう
  var TRY_MS    = 25000; // 1回の問い合わせを待つ上限

  var started = Date.now();
  var stopped = false;

  var dotsBox = document.getElementById('dots');
  for (var i = 0; i < DOTS; i++) dotsBox.appendChild(document.createElement('span'));
  var dots = dotsBox.children;

  function sec() { return Math.round((Date.now() - started) / 1000); }

  function paint() {
    var s = sec();
    var lit = Math.min(DOTS, Math.floor((s / FULL_SEC) * DOTS) + 1);
    for (var i = 0; i < DOTS; i++) {
      dots[i].className = i < lit ? 'on' : '';
    }
    document.getElementById('elapsed').textContent = '経過 ' + s + '秒';
    if (s >= SLOW_SEC) document.getElementById('slow').classList.remove('hidden');
  }
  paint();
  var ticker = setInterval(paint, 1000);

  // 予告編を見ている間は、勝手にゲームへ飛ばさない。
  // 途中で画面が切り替わるのは、待たせるより不快なので。
  var watching = false;
  var readyWhileWatching = false;

  // ★ サーバーが既に起きていると、1秒たらずでゲームへ飛んでしまい、
  //   予告編を押す間もなかった。
  //
  //   最初は「初めての人だけ止める」にしたが、それも駄目だった ―
  //   一度でも通った人は二度と予告編に辿り着けない。作者本人が
  //   何度も開くので、実際にすぐ再現した。
  //
  //   いま採っているのは「待った人だけ自動で送る」という決め方。
  //     ・眠っていて待たされた → 待ちが終わったのだから、そのまま送る
  //     ・最初から起きていた   → そもそも待っていない。ここは入口として
  //                              見せ、押して入ってもらう(自動で送らない)
  //   これなら誰でも、何度でも、予告編に辿り着ける。
  var WAITED_SEC = 3;      // これ以上かかったら「待たされた」とみなす

  function enterGame() {
    stopped = true;
    clearInterval(ticker);
    // replace にして、ゲームから戻るを押した時にこの待機ページへ戻らないようにする
    location.replace(GAME);
  }

  function showEntrance() {
    clearInterval(ticker);
    document.getElementById('lead').textContent = '✧ 準備ができました ✧';
    document.getElementById('why').classList.add('hidden');
    document.getElementById('slow').classList.add('hidden');
    document.getElementById('dots').classList.add('hidden');
    document.getElementById('elapsed').textContent = '';
    document.getElementById('ready').classList.remove('hidden');
    document.getElementById('ready-count').textContent =
      'いつでもどうぞ。先に予告編を見ることもできます。';
  }

  function goGame() {
    if (stopped) return;
    if (watching) {
      // 見終わるか閉じるまで待つ。準備ができたことだけ伝える。
      readyWhileWatching = true;
      document.getElementById('pv-note').textContent =
        '✓ 準備ができました。見終わったら「今すぐ遊ぶ」へ。';
      return;
    }
    if (sec() < WAITED_SEC) {
      // 待っていない = 最初から起きていた。入口として見せる。
      stopped = true;
      showEntrance();
      return;
    }
    enterGame();
  }

  function giveUp() {
    stopped = true;
    clearInterval(ticker);
    document.getElementById('lead').textContent = '⚠ 目を覚ましませんでした';
    document.getElementById('why').classList.add('hidden');
    document.getElementById('slow').classList.add('hidden');
    document.getElementById('failed').classList.remove('hidden');
  }

  // 1回の問い合わせ。眠っている相手は、起きるまで返事を返さずに
  // つないだまま待たせてくることがある。放っておくと止まって見えるので、
  // 上限を決めて切り、掛け直す。
  function probe() {
    var ctrl = ('AbortController' in window) ? new AbortController() : null;
    var timer = setTimeout(function () { if (ctrl) ctrl.abort(); }, TRY_MS);
    var opts = { cache: 'no-store' };
    if (ctrl) opts.signal = ctrl.signal;
    return fetch(PROBE, opts).then(function (res) {
      clearTimeout(timer);
      return res.ok;
    })['catch'](function () {
      clearTimeout(timer);
      return false;
    });
  }

  function loop() {
    if (stopped) return;
    probe().then(function (awake) {
      if (stopped) return;
      if (awake) { goGame(); return; }
      if (sec() >= GIVEUP_SEC) { giveUp(); return; }
      setTimeout(loop, 2000);
    });
  }

  // fetch が無いほど古い入れ物では、待たせずにそのまま送る。
  // 起動画面は出てしまうが、ここで足止めするよりはよい。
  if (!window.fetch) { goGame(); return; }
  loop();

  // ---- 予告編 ----
  //
  // 押されるまで読み込まない。待機ページの取り柄は「すぐ出る」ことなので、
  // 21MBの動画を最初から取りに行かせてはいけない。
  var modal = document.getElementById('pv-modal');
  var video = document.getElementById('pv-video');

  function openPv() {
    watching = true;
    modal.classList.remove('hidden');
    document.getElementById('pv-note').textContent = '';
    video.load();                       // ここで初めて取りに行く
    var p = video.play();
    if (p && p['catch']) p['catch'](function () { /* 自動再生を断られたら手で押してもらう */ });
  }

  function closePv() {
    watching = false;
    modal.classList.add('hidden');
    try { video.pause(); } catch (e) { /* 既に止まっている */ }
    // 見ている間に準備ができていたら、閉じた時点で送る。
    // 待たされていた人は、見終わったのだからそのまま送ってよい。
    if (readyWhileWatching) enterGame();
  }

  document.getElementById('btn-pv').addEventListener('click', openPv);
  document.getElementById('pv-thumb').addEventListener('click', openPv);
  document.getElementById('btn-pv-close').addEventListener('click', closePv);
  document.getElementById('btn-enter').addEventListener('click', enterGame);
  video.addEventListener('ended', function () {
    document.getElementById('pv-note').textContent = readyWhileWatching
      ? '✓ 準備ができました。「今すぐ遊ぶ」へ。'
      : 'まだ起こしている最中です。閉じるとそのままお待ちいただけます。';
  });

  document.getElementById('retry').addEventListener('click', function () {
    started = Date.now();
    stopped = false;
    document.getElementById('lead').textContent = '✧ 魔導炉に火を入れています ✧';
    document.getElementById('why').classList.remove('hidden');
    document.getElementById('failed').classList.add('hidden');
    paint();
    ticker = setInterval(paint, 1000);
    loop();
  });
})();
</script>
</body>
</html>
