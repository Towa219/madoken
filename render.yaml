# Render Blueprint: 魔導研究記(クライアント配信+Colyseusサーバー)
# Render無料プランで1サービスとして動かす
services:
  - type: web
    name: madoken
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "22.12.0"

    # ★ ゲームに関係のない変更では、デプロイを走らせない。
    #
    #   main に push するたびに Render は毎回ビルドし直す。
    #   名刺の位置合わせ(tools/meishi)を10回ほど繰り返した日は、
    #   ゲームのコードを1行も変えていないのにデプロイが10回走り、
    #   そのうち1回が失敗して「deploy failed」のメールが届いた。
    #   遊んでいる人には何も届かない変更のために、無料枠のビルド時間を
    #   使い、失敗の知らせで驚かせるのは割に合わない。
    #
    #   ここに挙げた場所だけが変わった push は、まるごと無視される。
    #   ・tools/  … 名刺・題字・動画などの道具(ゲームには入らない)
    #   ・docs/   … 入口の待機ページ(GitHub Pagesが配信する。Renderは無関係)
    #   ・test/   … 検証コード(配信物には1バイトも入らない)
    #   ・*.md    … 説明書き
    #   ★ shared/ src/ server/ public/ index.html を触った時は今までどおり出る。
    #
    #   ★ test/ を足した理由(2026-08-13)
    #     配備のたびにサーバーが再起動し、**遊んでいる最中の人が全員切れる**。
    #     「ボス戦で切断される」を調べていた日、検証コードを書き足すだけで
    #     何度も本番を再起動させていた。検証は配信物に入らないのだから、
    #     遊んでいる人を蹴ってまで出し直す理由が無い。
    #     ※ 検証だけを直した回は型エラーが本番ビルドまで持ち越される。
    #       手元で必ず tsc を通してから push すること。
    buildFilter:
      ignoredPaths:
        - tools/**
        - docs/**
        - test/**
        - "**/*.md"
        - "20260806.txt"
