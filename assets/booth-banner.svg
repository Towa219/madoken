<!-- BOOTHショップのヘッダー画像(1200x300想定)
     BOOTHはヘッダーの左下にショップアイコンを重ねて表示するため、
     左端360px・下端70px は「安全地帯」として何も置かない。
     使い方: ブラウザで開いてスクリーンショット、または画像変換サイトでPNG化 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1636"/>
      <stop offset="50%" stop-color="#241c3c"/>
      <stop offset="100%" stop-color="#0f0f1e"/>
    </linearGradient>
    <filter id="g2" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="300" fill="url(#sky)"/>

  <!-- 舞う光(エレメント)。文字とアイコンを避けて上辺と右端に置く -->
  <g filter="url(#g2)" opacity="0.85">
    <circle cx="430"  cy="42"  r="7" fill="#ff6644"/>
    <circle cx="600"  cy="28"  r="6" fill="#44aaff"/>
    <circle cx="1160" cy="60"  r="8" fill="#ffdd44"/>
    <circle cx="1175" cy="150" r="6" fill="#aaeeff"/>
    <circle cx="1150" cy="240" r="8" fill="#aa66ee"/>
    <circle cx="1080" cy="34"  r="6" fill="#88ffaa"/>
  </g>

  <!-- 文字は右寄りに集める(左360pxはアイコン用に空ける) -->
  <text x="780" y="112" text-anchor="middle"
        font-family="Yu Mincho, Hiragino Mincho ProN, serif" font-size="66" font-weight="bold"
        fill="#f0e6ff" filter="url(#g2)" letter-spacing="8">魔導研究記</text>
  <text x="780" y="156" text-anchor="middle"
        font-family="Yu Gothic, Meiryo, sans-serif" font-size="24"
        fill="#ccbbff" letter-spacing="4">《まどけん》</text>
  <text x="780" y="196" text-anchor="middle"
        font-family="Yu Gothic, Meiryo, sans-serif" font-size="20"
        fill="#a0a0cc">エレメントを混ぜて、まだ誰も知らない魔法を発明する</text>
  <text x="780" y="224" text-anchor="middle"
        font-family="Consolas, monospace" font-size="19"
        fill="#88bbdd">madoken.onrender.com</text>
</svg>
